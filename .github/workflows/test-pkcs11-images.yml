name: Test PKCS11 Images

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/test-pkcs11-images.yml
      - config/images/pkcs11/**
      - hack/test-pkcs11-images.sh
      - Makefile
  pull_request:
    paths:
      - .github/workflows/test-pkcs11-images.yml
      - config/images/pkcs11/**
      - hack/test-pkcs11-images.sh
      - Makefile

permissions:
  contents: read

jobs:
  softhsm:
    name: SoftHSM enrollment and peer startup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Check shell scripts
        run: shellcheck config/images/pkcs11/*.sh hack/test-pkcs11-images.sh
      - name: Build and test PKCS11 images
        run: make test-pkcs11-images
