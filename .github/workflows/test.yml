name: Tests

on:
  push:
  pull_request:

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Verify Go modules are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Run unit and envtest suite
        run: |
          make test

      - name: Run Go settlement sample contract tests
        working-directory: config/samples/chaincodes/go_settlement
        run: go test ./...

      - name: Verify fabricopsctl release version
        run: |
          make build-fabricopsctl-release VERSION=1.2.3
          test "$(bin/fabricopsctl version)" = "fabricopsctl 1.2.3"

      - name: Verify generated files are committed
        run: git diff --exit-code
