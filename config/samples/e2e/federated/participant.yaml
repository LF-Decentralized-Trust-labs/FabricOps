apiVersion: fabricops.io/v1alpha1
kind: FabricParticipant
metadata:
  labels:
    app.kubernetes.io/name: fabricops
    app.kubernetes.io/managed-by: kustomize
  name: bankb-participant
spec:
  global:
    fabricVersion: "3.1.0"
    tls: true
    jobs:
      succeededHistoryTTLSeconds: 600
    storage:
      ca:
        size: 1Gi
      peer:
        size: 1Gi
  org:
    organization:
      name: BankB
      domain: bankb.fabricops.io
      mspName: BankBMSP
    ca:
      db: sqlite
    peer:
      instances: 1
      db: leveldb
      prefix: peer
      externalEndpoints:
        - name: peer0
          address: peer0.bankb.fabricops.test:7051
          exposure:
            type: LoadBalancer
            allowedSourceCIDRs: ["192.0.2.0/24"]
  network:
    name: federated-founder
    founderMSPID: BankAMSP
    orderers:
      - org: Orderer
        name: orderer0
        clientAddress: orderer.founder.fabricops.test:7050
        tlsRootCARef:
          configMapKeyRef:
            name: orderer0-artifacts
            key: tls-ca.pem
    peers:
      - org: BankA
        name: peer0
        address: peer0.banka.fabricops.test:7051
        tlsRootCARef:
          configMapKeyRef:
            name: banka-peer0-artifacts
            key: tls-ca.pem
  channels:
    - name: settlement
      blockRef:
        configMapKeyRef:
          name: settlement-artifacts
          key: settlement.block
      peers:
        - peer0
      anchorPeers:
        - name: peer0
          host: peer0.bankb.fabricops.test
          port: 7051
